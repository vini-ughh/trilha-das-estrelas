services:
  - type: web
    name: trilha-das-estrelas
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trilha-estrelas-db
          property: connectionString

databases:
  - name: trilha-estrelas-db
    plan: free